
name: 'Build'

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ========================================
      # 1. 各OSでSBCLを直接インストール
      # ========================================
      - name: Install SBCL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install -y sbcl

      # ========================================
      # 2. Quicklisp のインストール (依存解決用)
      # ========================================
      - name: Install Quicklisp
        shell: bash
        run: |
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive \
               --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'

      # ========================================
      # 3. ビルド実行
      # ========================================
      - name: Build Executable
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sbcl --non-interactive \
               --load ~/quicklisp/setup.lisp \
               --eval "(asdf:initialize-source-registry
                         (list :source-registry
                               :inherit-configuration
                               (list :tree (uiop:parse-native-namestring (uiop:getenv \"GITHUB_WORKSPACE\")))))" \
               --eval '(ql:quickload :scp-q-formatter)' \
               --eval '(asdf:make :scp-q-formatter)'

      # ========================================
      # 4. アーティファクトの回収
      # ========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scp-q-formatter-${{ matrix.os }}
          path: |
            scp-q-formatter
            scp-q-formatter.exe
