
name: 'Build'

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ========================================
      # 1. 各OSでSBCLをインストール
      # ========================================
      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install -y sbcl

      # ========================================
      # 2. ocicl のインストール
      # ========================================
      - name: Install ocicl (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg \
            | sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" \
            | sudo tee /etc/apt/sources.list.d/ocicl.list
          sudo apt update
          sudo apt install -y ocicl
          ocicl setup

      - name: Install ocicl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ocicl
          ocicl setup

      - name: Install ocicl (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone https://github.com/ocicl/ocicl.git /tmp/ocicl
          cd /tmp/ocicl
          sbcl --load setup.lisp
          # ociclバイナリのディレクトリをPATHに追加
          echo "$USERPROFILE/AppData/Local/ocicl" >> "$GITHUB_PATH"

      # ========================================
      # 3. 依存関係のインストールとビルド
      # ========================================
      - name: Install Dependencies and Build Executable
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          # プロジェクトローカルのみを使用し、グローバルシステムを無視
          OCICL_LOCAL_ONLY: '1'
        run: |
          # ocicl.csv に基づいて依存システムをプロジェクトローカルにダウンロード
          ocicl install

          # ocicl setup は .sbclrc に追加すべきコードを出力するだけなので、
          # 手動で .sbclrc を作成する。
          # ocicl-runtime のパスはOSによって異なるため複数パスを probe-file でチェック。
          # また、ワークスペースを :tree として source-registry に追加し、
          # submodule 配下の .asd も再帰的に発見できるようにする。
          cat > ~/.sbclrc << 'EOF'
          #-ocicl
          (when (probe-file #P"/usr/local/share/ocicl/ocicl-runtime.lisp")
            (load #P"/usr/local/share/ocicl/ocicl-runtime.lisp"))
          (when (probe-file (merge-pathnames ".local/share/ocicl/ocicl-runtime.lisp"
                                            (user-homedir-pathname)))
            (load (merge-pathnames ".local/share/ocicl/ocicl-runtime.lisp"
                                   (user-homedir-pathname))))
          (when (probe-file (merge-pathnames "AppData/Local/ocicl/ocicl-runtime.lisp"
                                            (user-homedir-pathname)))
            (load (merge-pathnames "AppData/Local/ocicl/ocicl-runtime.lisp"
                                   (user-homedir-pathname))))
          EOF

          # CL_SOURCE_REGISTRY は使わず、--eval で source-registry を初期化する。
          # :tree を :inherit-configuration の前に置くことで、
          # ローカルのシステムを優先的に検索させる。
          sbcl --non-interactive \
               --eval "(asdf:initialize-source-registry
                         (list :source-registry
                               (list :tree (uiop:parse-native-namestring
                                             (uiop:getenv \"GITHUB_WORKSPACE\")))
                               :inherit-configuration))" \
               --eval '(asdf:make :scp-q-formatter)'

      # ========================================
      # 4. アーティファクトの回収
      # ========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scp-q-formatter-${{ matrix.os }}
          path: |
            scp-q-formatter
            scp-q-formatter.exe
