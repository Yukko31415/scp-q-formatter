
name: 'Build'

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ========================================
      # 1. 各OSでSBCLをインストール
      # ========================================
      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install -y sbcl

      # ========================================
      # 2. ocicl のインストール
      # ========================================
      - name: Install ocicl (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ocicl.github.io/ocicl/deb-repo/ocicl-archive-keyring.gpg \
            | sudo tee /usr/share/keyrings/ocicl-archive-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/ocicl-archive-keyring.asc] https://ocicl.github.io/ocicl/deb-repo stable main" \
            | sudo tee /etc/apt/sources.list.d/ocicl.list
          sudo apt update
          sudo apt install -y ocicl
          yes | ocicl setup

      - name: Install ocicl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ocicl
          yes | ocicl setup

      - name: Install ocicl (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone https://github.com/ocicl/ocicl.git /tmp/ocicl
          cd /tmp/ocicl
          sbcl --load setup.lisp
          # ociclバイナリのディレクトリをPATHに追加
          echo "$USERPROFILE/AppData/Local/ocicl" >> "$GITHUB_PATH"
          yes | ocicl setup

      # ========================================
      # 3. 依存関係のインストールとビルド
      # ========================================
      - name: Install Dependencies and Build Executable
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          # プロジェクトローカルのみを使用し、グローバルシステムを無視
          OCICL_LOCAL_ONLY: '1'
          # 末尾の // で :tree (再帰検索) を指定
          # submodule 配下の .asd も発見される
          CL_SOURCE_REGISTRY: '${{ github.workspace }}//'
        run: |
          # ocicl.csv に基づいて依存システムをプロジェクトローカルにダウンロード
          ocicl install

          # CL_SOURCE_REGISTRY が設定済みなので --eval での初期化は不要
          sbcl --non-interactive \
               --eval '(asdf:make :scp-q-formatter)'

      # ========================================
      # 4. アーティファクトの回収
      # ========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scp-q-formatter-${{ matrix.os }}
          path: |
            scp-q-formatter
            scp-q-formatter.exe
